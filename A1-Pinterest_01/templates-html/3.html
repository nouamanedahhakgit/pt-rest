<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pin Template 3</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1000px; height: 1500px; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; background: #fef6f1; }
  .pin { position: relative; width: 1000px; height: 1500px; background: #fef6f1; }
  .blob {
    position: absolute; border-radius: 50%;
  }
  .blob.b1 { width: 720px; height: 720px; top: -200px; left: -180px; background: #ffd6c2; opacity: 0.80; }
  .blob.b2 { width: 720px; height: 720px; bottom: -220px; right: -200px; background: #c2e7d6; opacity: 0.80; }
  .photo {
    position: absolute;
    background-position: center; background-size: cover; background-repeat: no-repeat;
    box-shadow: 0 16px 40px rgba(70,40,30,0.20);
    border: 8px solid #fff;
  }
  .photo.top    { top: 70px;  left: 70px;  right: 70px;  height: 580px; border-radius: 24px; transform: rotate(-1.8deg); }
  .photo.bottom { top: 700px; left: 130px; right: 130px; height: 360px; border-radius: 22px; transform: rotate(2deg); }
  /* ── text card at bottom ── */
  .card {
    position: absolute; left: 44px; right: 44px; bottom: 40px;
    background: #fff; border-radius: 22px; padding: 28px 36px 26px;
    box-shadow: 0 14px 30px rgba(70,40,30,0.15);
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .kicker {
    font-size: 20px; letter-spacing: 5px; text-transform: uppercase;
    color: #e07a5f; font-weight: 700;
  }
  .hook {
    font-size: 32px; font-style: italic; color: #5a3a2a; line-height: 1.15;
  }
  .hook:empty { display: none; }
  .title {
    font-family: 'Georgia', serif;
    font-weight: 800; color: #2d2a32; font-size: 68px; line-height: 1.04;
  }
  .title.long  { font-size: 56px; }
  .title.xlong { font-size: 44px; }
  .dots { display: flex; gap: 10px; align-items: center; justify-content: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #e07a5f; }
  .caption {
    font-size: 26px; color: #8a6a5a; line-height: 1.25; font-style: italic;
  }
  .caption:empty { display: none; }
</style>
</head>
<body>
  <div class="pin">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="photo top"    style="background-image:url('{{image_1}}');"></div>
    <div class="photo bottom" style="background-image:url('{{image_2}}');"></div>
    <div class="card">
      <div class="kicker">Tasty &middot; Easy &middot; Fresh</div>
      <div class="hook">{{hook}}</div>
      <div class="title" id="ttl">{{title}}</div>
      <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="caption">{{text}}</div>
    </div>
  </div>
  <script>
    (function(){
      var t = document.getElementById('ttl');
      var n = (t.textContent || '').length;
      if (n > 65) t.classList.add('xlong');
      else if (n > 42) t.classList.add('long');
      document.querySelectorAll('.hook, .caption').forEach(function(el){
        if (!el.textContent.trim()) el.style.display='none';
      });
    })();
  </script>
</body>
</html>
