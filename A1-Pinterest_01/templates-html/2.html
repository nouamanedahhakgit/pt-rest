<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pin Template 2</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1000px; height: 1500px; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; background: #111; }
  .pin { position: relative; width: 1000px; height: 1500px; background: #111; }
  .photo {
    position: absolute; left: 0; right: 0;
    background-position: center; background-size: cover; background-repeat: no-repeat;
  }
  .photo.top    { top: 0;    height: 760px; }
  .photo.bottom { top: 740px; height: 760px; }
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(
      180deg,
      rgba(0,0,0,0.04) 0%,
      rgba(0,0,0,0.04) 22%,
      rgba(0,0,0,0.82) 35%,
      rgba(0,0,0,0.82) 65%,
      rgba(0,0,0,0.04) 78%,
      rgba(0,0,0,0.04) 100%
    );
  }
  .band {
    position: absolute; left: 0; right: 0; top: 420px; height: 660px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 80px; gap: 18px;
  }
  .eyebrow {
    text-transform: uppercase; letter-spacing: 8px;
    font-size: 22px; color: #f3c969; font-weight: 600;
    text-align: center;
  }
  .hook {
    font-size: 36px; font-style: italic; color: #fff;
    text-align: center; line-height: 1.2;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  .hook:empty { display: none; }
  .title {
    font-family: 'Georgia', serif;
    font-weight: 800; font-size: 100px; line-height: 1.02; color: #fff;
    text-align: center;
    text-shadow: 0 4px 18px rgba(0,0,0,0.6);
  }
  .title.long  { font-size: 80px; }
  .title.xlong { font-size: 64px; }
  .rule { width: 110px; height: 3px; background: #f3c969; flex-shrink: 0; }
  .caption {
    font-size: 32px; color: #e8e8e8; text-align: center; line-height: 1.25;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  .caption:empty { display: none; }
</style>
</head>
<body>
  <div class="pin">
    <div class="photo top"    style="background-image:url('{{image_1}}');"></div>
    <div class="photo bottom" style="background-image:url('{{image_2}}');"></div>
    <div class="scrim"></div>
    <div class="band">
      <div class="eyebrow">Made with love</div>
      <div class="hook">{{hook}}</div>
      <div class="title" id="ttl">{{title}}</div>
      <div class="rule"></div>
      <div class="caption">{{text}}</div>
    </div>
  </div>
  <script>
    (function(){
      var t = document.getElementById('ttl');
      var n = (t.textContent || '').length;
      if (n > 65) t.classList.add('xlong');
      else if (n > 42) t.classList.add('long');
      document.querySelectorAll('.hook, .caption').forEach(function(el){
        if (!el.textContent.trim()) el.style.display='none';
      });
    })();
  </script>
</body>
</html>
