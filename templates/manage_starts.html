<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Manage STARTS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f8f9fd; }
    .materio-sidebar { width: 250px; min-height: 100vh; background: #fff; border-right: 1px solid #eceef1; position: fixed; left: 0; top: 0; padding: 20px; }
    .materio-sidebar .sidebar-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 1rem; display: flex; align-items: center; }
    .materio-sidebar ul { list-style: none; padding: 0; }
    .materio-sidebar ul li { margin: 10px 0; }
    .materio-sidebar ul li a { text-decoration: none; color: #626262; font-weight: 500; display: block; padding: 8px 10px; border-radius: 6px; }
    .materio-sidebar ul li a:hover, .materio-sidebar ul li a.active { background: #7367F0; color: #fff; }
    .navbar-materio { margin-left: 270px; background: #fff; border-bottom: 1px solid #eceef1; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: fixed; width: calc(100% - 270px); top: 0; z-index: 1000; }
    .materio-content { margin-left: 270px; padding: 20px; margin-top: 80px; max-width: 1300px; }
    .table-wrap { max-height: 520px; overflow: auto; background: #fff; border: 1px solid #eceef1; border-radius: 8px; }
    .mono { font-family: ui-monospace, Consolas, monospace; }
  </style>
</head>
<body>
  <div class="materio-sidebar">
    <div class="sidebar-title"><i class="bx bx-grid-alt"></i><span>AUTOMATION</span></div>
    <ul>
      <li><a href="/"><i class="bx bx-home-alt"></i> Dashboard</a></li>
      <li><a href="/manage_sites"><i class="bx bx-list-ul"></i> Projects (sites)</a></li>
      <li><a href="/manage_starts" class="active"><i class="bx bx-table"></i> Manage STARTS</a></li>
      <li><a href="/manage_recipes"><i class="bx bx-food-menu"></i> Manage Recipes</a></li>
      <li><a href="/manage_images"><i class="bx bx-image"></i> Manage Images</a></li>
      <li><a href="/manage_articles"><i class="bx bx-file"></i> Manage Articles</a></li>
    </ul>
  </div>

  <div class="navbar-materio">
    <h5 class="m-0">Manage STARTS Excel Files</h5>
  </div>

  <div class="materio-content">
    <div id="msg"></div>
    <div class="row g-3">
      <div class="col-lg-4">
        <div class="card">
          <div class="card-header"><strong>Files</strong></div>
          <div class="card-body">
            <div class="input-group mb-2">
              <input id="pattern" class="form-control mono" value="START*.xlsx" />
              <button class="btn btn-outline-primary" id="btnRefresh"><i class="bx bx-refresh"></i></button>
            </div>
            <select id="fileSelect" class="form-select mb-2" size="10"></select>
            <div id="fileMeta" class="small text-muted"></div>
          </div>
        </div>

        <div class="card mt-3">
          <div class="card-header"><strong>Create File</strong></div>
          <div class="card-body">
            <input id="newFileName" class="form-control mb-2 mono" placeholder="START51.xlsx" />
            <button id="btnCreateFile" class="btn btn-success w-100"><i class="bx bx-plus"></i> Create</button>
          </div>
        </div>

        <div class="card mt-3">
          <div class="card-header"><strong>Add Rows</strong></div>
          <div class="card-body">
            <textarea id="titlesInput" class="form-control mono mb-2" rows="7" placeholder="One title per line"></textarea>
            <button id="btnAddRows" class="btn btn-primary w-100"><i class="bx bx-save"></i> Append To Selected File</button>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <strong>Rows</strong>
            <div class="d-flex align-items-center gap-2">
              <button id="btnSaveChanges" class="btn btn-sm btn-primary">Save Edited Rows</button>
              <button id="btnSelectAll" class="btn btn-sm btn-outline-secondary">Select All (Page)</button>
              <button id="btnUnselectAll" class="btn btn-sm btn-outline-secondary">Unselect All</button>
              <button id="btnClearFile" class="btn btn-sm btn-outline-danger">Clear All File Data</button>
              <button id="btnPrev" class="btn btn-sm btn-outline-secondary">Prev</button>
              <button id="btnNext" class="btn btn-sm btn-outline-secondary">Next</button>
            </div>
          </div>
          <div class="card-body">
            <div id="rowsMeta" class="small text-muted mb-2"></div>
            <div class="d-flex gap-2 mb-2">
              <button id="btnDeleteSelected" class="btn btn-sm btn-outline-danger">Delete Selected Rows</button>
            </div>
            <div class="table-wrap">
              <table class="table table-sm table-striped mb-0" id="rowsTable">
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentProject = "";
    let currentOffset = 0;
    const pageSize = 100;
    let currentHeaders = [];
    let currentRows = [];
    let dirtyRows = new Set();

    function showMsg(text, kind) {
      const cls = kind === "error" ? "alert-danger" : "alert-success";
      document.getElementById("msg").innerHTML =
        `<div class="alert ${cls} alert-dismissible fade show" role="alert">${text}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
    }

    async function loadFiles() {
      const res = await fetch(`/api/starts-files`);
      const js = await res.json();
      const sel = document.getElementById("fileSelect");
      sel.innerHTML = "";
      (js.items || []).forEach((it) => {
        const opt = document.createElement("option");
        opt.value = it.project || it.name;
        const mark = it.exists ? "" : " [missing]";
        opt.textContent = `${it.project || it.name}${mark} (rows:${it.row_count}, titles:${it.title_count})`;
        sel.appendChild(opt);
      });
      if (sel.options.length > 0) {
        if (!currentProject) currentProject = sel.options[0].value;
        sel.value = currentProject;
        onSelectFile();
      } else {
        document.getElementById("fileMeta").textContent = "No files";
        renderRows([], []);
      }
    }

    function renderRows(headers, rows) {
      currentHeaders = headers || [];
      currentRows = rows || [];
      dirtyRows = new Set();
      const thead = document.querySelector("#rowsTable thead");
      const tbody = document.querySelector("#rowsTable tbody");
      thead.innerHTML = "";
      tbody.innerHTML = "";
      if (!headers || headers.length === 0) return;

      const trh = document.createElement("tr");
      const thSel = document.createElement("th");
      thSel.textContent = "sel";
      trh.appendChild(thSel);
      const th0 = document.createElement("th");
      th0.textContent = "excel_row";
      trh.appendChild(th0);
      headers.forEach((h) => {
        const th = document.createElement("th");
        th.textContent = h;
        trh.appendChild(th);
      });
      const thAct = document.createElement("th");
      thAct.textContent = "actions";
      trh.appendChild(thAct);
      thead.appendChild(trh);

      rows.forEach((r) => {
        const tr = document.createElement("tr");
        const tdSel = document.createElement("td");
        tdSel.innerHTML = `<input type="checkbox" class="row-check" data-row="${r.excel_row ?? ""}">`;
        tr.appendChild(tdSel);
        const td0 = document.createElement("td");
        td0.textContent = r.excel_row ?? "";
        tr.appendChild(td0);
        headers.forEach((h, idx) => {
          const td = document.createElement("td");
          const v = r[h];
          td.textContent = v == null ? "" : String(v);
          td.contentEditable = "true";
          td.classList.add("cell-edit");
          td.dataset.header = h;
          td.dataset.row = String(r.excel_row ?? "");
          td.dataset.col = String(idx + 1);
          tr.appendChild(td);
        });
        const tdAct = document.createElement("td");
        tdAct.innerHTML = `<button class="btn btn-sm btn-outline-danger btn-del-row" data-row="${r.excel_row ?? ""}">Delete</button>`;
        tr.appendChild(tdAct);
        tbody.appendChild(tr);
      });
    }

    async function loadRows() {
      if (!currentProject) return;
      const q = `project=${encodeURIComponent(currentProject)}&offset=${currentOffset}&limit=${pageSize}`;
      const res = await fetch(`/api/starts-read?${q}`);
      const js = await res.json();
      if (!js.ok) {
        showMsg(js.error || "Read failed", "error");
        return;
      }
      document.getElementById("rowsMeta").textContent = `${currentProject} | showing ${js.rows.length} rows | total ${js.total_rows} | offset ${js.offset}`;
      renderRows(js.headers || [], js.rows || []);
    }

    function onSelectFile() {
      const sel = document.getElementById("fileSelect");
      currentProject = sel.value || "";
      currentOffset = 0;
      document.getElementById("fileMeta").textContent = currentProject ? `Selected project: ${currentProject}` : "No project selected";
      loadRows();
    }

    async function createFile() {
      showMsg("Project START files are auto-created from projects/sites config.", "ok");
    }

    async function addRows() {
      if (!currentProject) return showMsg("Select a project first", "error");
      const lines = (document.getElementById("titlesInput").value || "")
        .split(/\r?\n/)
        .map((s) => s.trim())
        .filter(Boolean);
      if (lines.length === 0) return showMsg("Add at least one title line", "error");

      const res = await fetch("/api/starts-add-rows", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ project: currentProject, titles: lines }),
      });
      const js = await res.json();
      if (!js.ok) return showMsg(js.error || "Append failed", "error");
      document.getElementById("titlesInput").value = "";
      showMsg(`Added ${js.added_rows} rows to ${currentProject} START`, "ok");
      await loadFiles();
      await loadRows();
    }

    async function saveDirtyRows() {
      if (!currentProject) return showMsg("Select a project first", "error");
      const rows = Array.from(dirtyRows).map((x) => Number(x)).filter((x) => x >= 2);
      if (rows.length === 0) return showMsg("No edited rows to save", "error");
      let okCount = 0;
      for (const rr of rows) {
        const tr = document.querySelector(`#rowsTable tbody .row-check[data-row="${rr}"]`)?.closest("tr");
        if (!tr) continue;
        const values = {};
        const valuesByCol = {};
        tr.querySelectorAll(".cell-edit").forEach((td) => {
          const h = td.dataset.header || "";
          if (!h) return;
          const vv = (td.textContent || "").trim();
          values[h] = vv;
          const cc = Number(td.dataset.col || 0);
          if (cc >= 1) valuesByCol[String(cc)] = vv;
        });
        const res = await fetch("/api/starts-update-row", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ project: currentProject, excel_row: rr, values, values_by_col: valuesByCol }),
        });
        const js = await res.json();
        if (js.ok) okCount += 1;
      }
      showMsg(`Saved ${okCount}/${rows.length} edited row(s)`, okCount === rows.length ? "ok" : "error");
      await loadRows();
      await loadFiles();
    }

    async function deleteRows(excelRows) {
      const rows = (excelRows || []).map((x) => Number(x)).filter((x) => x >= 2);
      if (rows.length === 0) return showMsg("No rows selected", "error");
      if (!confirm(`Delete ${rows.length} row(s) from ${currentProject}?`)) return;
      const res = await fetch("/api/starts-delete-rows", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ project: currentProject, excel_rows: rows }),
      });
      const js = await res.json();
      if (!js.ok) return showMsg(js.error || "Delete failed", "error");
      showMsg(`Deleted ${js.deleted_rows} row(s)`, "ok");
      await loadFiles();
      await loadRows();
    }

    async function clearFileData() {
      if (!currentProject) return showMsg("Select a project first", "error");
      if (!confirm(`Clear ALL data rows in ${currentProject}? (Header row will stay)`)) return;
      const res = await fetch("/api/starts-clear-file", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ project: currentProject }),
      });
      const js = await res.json();
      if (!js.ok) return showMsg(js.error || "Clear failed", "error");
      showMsg(`Cleared ${js.cleared_rows} row(s) in ${currentProject} START`, "ok");
      currentOffset = 0;
      await loadFiles();
      await loadRows();
    }

    document.getElementById("btnRefresh").addEventListener("click", loadFiles);
    document.getElementById("fileSelect").addEventListener("change", onSelectFile);
    document.getElementById("btnCreateFile").addEventListener("click", createFile);
    document.getElementById("btnAddRows").addEventListener("click", addRows);
    document.getElementById("btnPrev").addEventListener("click", () => {
      currentOffset = Math.max(0, currentOffset - pageSize);
      loadRows();
    });
    document.getElementById("btnNext").addEventListener("click", () => {
      currentOffset += pageSize;
      loadRows();
    });
    document.getElementById("btnDeleteSelected").addEventListener("click", () => {
      const els = document.querySelectorAll(".row-check:checked");
      const rows = Array.from(els).map((el) => Number(el.getAttribute("data-row") || 0));
      deleteRows(rows);
    });
    document.getElementById("btnSaveChanges").addEventListener("click", saveDirtyRows);
    document.getElementById("btnSelectAll").addEventListener("click", () => {
      document.querySelectorAll(".row-check").forEach((el) => { el.checked = true; });
    });
    document.getElementById("btnUnselectAll").addEventListener("click", () => {
      document.querySelectorAll(".row-check").forEach((el) => { el.checked = false; });
    });
    document.getElementById("btnClearFile").addEventListener("click", clearFileData);
    document.querySelector("#rowsTable tbody").addEventListener("input", (ev) => {
      const td = ev.target.closest(".cell-edit");
      if (!td) return;
      const rr = Number(td.dataset.row || 0);
      if (rr >= 2) {
        dirtyRows.add(rr);
        td.style.backgroundColor = "#fff8e1";
      }
    });
    document.querySelector("#rowsTable tbody").addEventListener("click", (ev) => {
      const dBtn = ev.target.closest(".btn-del-row");
      if (dBtn) {
        deleteRows([dBtn.getAttribute("data-row")]);
      }
    });

    loadFiles();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
